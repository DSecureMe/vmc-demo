version: '3.3'

services:
  web:
    image: allegro/ralph:20220207.1
    container_name: ralph_web
    volumes:
      - ralph_media:/var/local/ralph/media
      - ralph_static:/usr/share/ralph/static
      - ../config/ralph/:/test_data
    depends_on:
      ralph_mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
      ralph_nginx:
        condition: service_started
    environment:
        DATABASE_NAME: ${MYSQL_DATABASE}
        DATABASE_USER: ${MYSQL_USER}
        DATABASE_PASSWORD: ${MYSQL_PASSWORD}
        DATABASE_HOST: ralph_mariadb
        REDIS_HOST: redis
        REDIS_PASSWORD: ""
        REDIS_PORT: 6379
        REDIS_DB: 0
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  ralph_nginx:
    image: allegro/ralph-static-nginx:20220207.1
    container_name: ralph_nginx
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ralph_media:/opt/media

  ralph_mariadb:
    image: mariadb:${MARIADB_VERSION}
    container_name: ralph_mariadb
    env_file: ../.env
    volumes:
      - mariadb-data:/var/lib/mysql
    command: mysqld --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  ralph_inkpy:
    image: allegro/inkpy:0.1.4
    container_name: ralph_inkpy
    environment:
        REDIS_HOST: redis
        REDIS_PASSWORD: ""
        REDIS_PORT: 6379
        REDIS_DB: 0

volumes:
  ralph_media:
    driver: local
  ralph_static:
    driver: local
  mariadb-data:
    driver: local
