version: '3.3'

services:
  admin:
    image: dsecureme/vmc:${VMC_VERSION}
    restart: unless-stopped
    container_name: vmc_admin
    command: ["admin"]
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../config/vmc/demo.yml:/etc/vmc/config.yml
      - ../config/vmc/:/test_data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/admin/login/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  nginx:
    image: dsecureme/vmc-static-nginx:${VMC_VERSION}
    container_name: vmc_static
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      admin:
        condition: service_healthy
    volumes:
      - ../config/vmc/demo.yml:/etc/vmc/config.yml
      - ../config/vmc/:/test_data

  worker:
    image: dsecureme/vmc:${VMC_VERSION}
    container_name: vmc_worker
    restart: unless-stopped
    command: ["worker"]
    depends_on:
      admin:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../config/vmc/demo.yml:/etc/vmc/config.yml

  scheduler:
    image: dsecureme/vmc:${VMC_VERSION}
    container_name: vmc_scheduler
    restart: unless-stopped
    command: ["scheduler"]
    depends_on:
      admin:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ../config/vmc/demo.yml:/etc/vmc/config.yml

  rabbitmq:
    container_name: rabbitmq
    image: rabbitmq:${RABBITMQ_VERSION}
    env_file: ../.env
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    container_name: redis
    image: redis:${REDDIS_VERSION}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s


volumes:
  vmc-backup-data:
    driver: local
