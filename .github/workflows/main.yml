name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint (shellcheck + bats)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck + bats
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck bats

      - name: Shellcheck
        run: shellcheck config/demo_data.sh config/kibana/load.sh config/elasticsearch/data/load.sh tests/assert_demodata.sh

      - name: Bats
        run: bats tests/

  smoke:
    name: Demo smoke (compose + demodata)
    runs-on: ubuntu-latest
    needs: [lint]
    timeout-minutes: 60
    steps:
      - name: Checkout vmc-dev-toolkit + submodules
        uses: actions/checkout@v4
        with:
          repository: DSecureMe/vmc-dev-toolkit
          submodules: recursive
          path: toolkit

      - name: Overlay current vmc-demo branch on toolkit submodule
        uses: actions/checkout@v4
        with:
          path: toolkit/vmc-demo
          clean: false

      - name: Build local dev images
        working-directory: toolkit
        run: make build

      - name: Pre-pull external images
        working-directory: toolkit
        run: |
          docker compose --env-file vmc-demo/.env \
            -f vmc-demo/compose/docker-compose.postgresql.yml \
            -f vmc-demo/compose/docker-compose.elk.yml \
            -f vmc-demo/compose/docker-compose.vmc.yml \
            -f compose/docker-compose.vmc-dev.yml \
            -f vmc-demo/compose/docker-compose.ralph.yml \
            -f vmc-demo/compose/docker-compose.hive.yml \
            -f vmc-demo/compose/docker-compose.elastalert.yml \
            pull --ignore-pull-failures || true

      - name: Bring up the stack
        working-directory: toolkit
        run: |
          docker compose --env-file vmc-demo/.env \
            -f vmc-demo/compose/docker-compose.postgresql.yml \
            -f vmc-demo/compose/docker-compose.elk.yml \
            -f vmc-demo/compose/docker-compose.vmc.yml \
            -f compose/docker-compose.vmc-dev.yml \
            -f vmc-demo/compose/docker-compose.ralph.yml \
            -f vmc-demo/compose/docker-compose.hive.yml \
            -f vmc-demo/compose/docker-compose.elastalert.yml \
            up -d

      - name: Wait for healthchecks
        working-directory: toolkit
        run: |
          DC="docker compose --env-file vmc-demo/.env -f vmc-demo/compose/docker-compose.postgresql.yml -f vmc-demo/compose/docker-compose.elk.yml -f vmc-demo/compose/docker-compose.vmc.yml -f compose/docker-compose.vmc-dev.yml -f vmc-demo/compose/docker-compose.ralph.yml -f vmc-demo/compose/docker-compose.hive.yml -f vmc-demo/compose/docker-compose.elastalert.yml"
          for i in $(seq 1 60); do
            if ! $DC ps --format '{{.Status}}' | grep -qE 'unhealthy|starting'; then break; fi
            sleep 10
          done
          $DC ps

      - name: Run demodata twice (idempotency)
        working-directory: toolkit
        run: |
          make demodata
          make demodata

      - name: Assert demodata
        working-directory: toolkit
        run: bash vmc-demo/tests/assert_demodata.sh

      - name: Dump compose logs on failure
        if: failure()
        working-directory: toolkit
        run: |
          docker compose --env-file vmc-demo/.env \
            -f vmc-demo/compose/docker-compose.postgresql.yml \
            -f vmc-demo/compose/docker-compose.elk.yml \
            -f vmc-demo/compose/docker-compose.vmc.yml \
            -f compose/docker-compose.vmc-dev.yml \
            -f vmc-demo/compose/docker-compose.ralph.yml \
            -f vmc-demo/compose/docker-compose.hive.yml \
            -f vmc-demo/compose/docker-compose.elastalert.yml \
            logs --tail=200
