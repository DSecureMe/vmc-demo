version: '3.3'

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELK_VERSION}
    container_name: elasticsearch
    volumes:
      - elastic-data:/usr/share/elasticsearch/data
      - ../config/elasticsearch/data:/test_data
      - ../config/elasticsearch/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml
    ports:
      - "9200:9200"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl -sf 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  kibana:
    image: docker.elastic.co/kibana/kibana:${ELK_VERSION}
    container_name: kibana
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - KBN_VERSION=${ELK_VERSION}
    volumes:
      - ../config/kibana/kibana.yml:/usr/share/kibana/config/kibana.yml
      - ../config/kibana/:/test_data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5601/api/status"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  elastic-data:
    driver: local
